<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint System | Submit Your Issue</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <header>
                <h1>Submit a Complaint</h1>
                <p>We value your feedback. Please provide the details below.</p>
            </header>
            
            <form id="complaintForm">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>
                
                <div class="input-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" placeholder="New York" required>
                </div>
                
                <div class="input-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="+1 (555) 000-0000" required>
                </div>
                
                <div class="input-group">
                    <label for="complaint">Complaint Details</label>
                    <textarea id="complaint" name="complaint" rows="4" placeholder="Describe your issue here..." required></textarea>
                </div>
                
                <button type="submit" id="submitBtn">
                    <span>Submit Complaint</span>
                    <div class="loader" id="loader"></div>
                </button>
            </form>
            
            <div id="responseMessage" class="response-message"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
